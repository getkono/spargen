# Dev tooling and the task runner; each gate task is held to its CI job (AGENTS.md, Quality).

[tools]
hk = "1.50.0"                               # git hook manager (aqua:jdx/hk)
"cargo:convco" = "0.7.1"                    # Conventional Commit checker
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"  # supply-chain audit
"aqua:rustsec/rustsec/cargo-audit" = "0.22.2"  # advisory + yank audit of every lockfile entry
"cargo:cargo-hack" = "0.6.39"               # feature-combination builds
"cargo:mdbook" = "0.5.4"                    # documentation site builder
"aqua:release-plz/release-plz" = "0.3.160"  # the changelog/version oracle release-plz.yml runs
"cargo:cargo-mutants" = "27.1.0"            # mutation testing (`mise run mutants`)

[tasks.fmt]
description = "Format the whole workspace"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Verify the whole workspace is formatted"
run = "cargo fmt --all --check"

[tasks.lint]
description = "Clippy across the workspace with warnings denied"
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks.lint-fix]
description = "Clippy across the workspace, applying machine-applicable fixes"
run = "cargo clippy --workspace --all-targets --all-features --fix --allow-dirty --allow-staged"

[tasks.check]
description = "Type-check the whole workspace"
run = "cargo check --workspace --all-features"

[tasks.runtime-dependencies]
description = "Resolve generated-runtime dependencies at their declared floors and compile them"
run = "cargo test -p spargen --test e2e runtime_dependency_floors_compile_with_direct_minimal_versions -- --exact --ignored --nocapture"

[tasks.powerset]
description = "Build every feature combination, not just --all-features"
# The `--no-dev-deps` lines check the libs without dev-dependency feature unification; the
# `--all-targets` lines compile `#[cfg(test)]` code at each feature set too (#237).
run = [
  "cargo hack check --workspace --each-feature --no-dev-deps",
  "cargo hack check -p support-runtime --no-dev-deps --feature-powerset",
  "cargo hack check --workspace --exclude support-runtime --each-feature --all-targets",
  "cargo hack check -p support-runtime --all-targets --feature-powerset",
]

[tasks.deny]
# CI's `deny` job in deny.yml runs these commands. AGENTS.md's "Lockfiles and advisories" states the
# rules they implement; `the_deny_gate_states_the_feature_scope_it_audits` and
# `the_lockfile_audit_reads_every_committed_lockfile` pin their shape. Why each part is there:
# - `--all-features`: rustls enters the graph only under it, so without it an advisory against
#   rustls is clean here and failing in CI (#141).
# - `--locked` on the root only: without it a skewed `Cargo.lock` was silently rewritten (or a
#   missing one written) and the rewrite audited (#146). The example workspaces are audited
#   unlocked, like every gate that compiles them: release-plz leaves their `spargen` stamp stale on
#   each release, so `--locked` would turn every release red (#184).
# - `cargo audit` over each lockfile: cargo-deny filters out entries no feature activates (a weak
#   `dep?/feature` target such as reqwest's quinn), so a yanked `chacha20` sat in `Cargo.lock` with
#   this audit green; `cargo audit` reads every entry (#187).
# - `cargo fetch` before each `--no-fetch` audit, and the error/warning guard after it: with
#   `--no-fetch` cargo-audit's yank check reads only Cargo's local index cache, and on an empty one
#   it printed "couldn't check if the package is yanked" for every entry and exited 0 (#414). The
#   fetch fills that cache; the guard fails a run that still could not check an entry.
# - The `git log` line prints the advisory-database revision every verdict was reached against.
description = "Supply-chain audit (licenses, advisories, bans, sources) of every committed lockfile"
run = [
  "cargo deny fetch db",
  "git -C target/advisory-dbs/advisory-db-3157b0e258782691 log -1 --format='advisory database revision %H (committed %cI)'",
  "cargo fetch --locked",
  "cargo audit --db target/advisory-dbs/advisory-db-3157b0e258782691 --no-fetch --deny warnings --file Cargo.lock 2>target/cargo-audit.stderr || { cat target/cargo-audit.stderr >&2; exit 1; }; cat target/cargo-audit.stderr >&2; if grep -qE 'error|warning' target/cargo-audit.stderr; then echo 'cargo audit exited 0 but printed an error or warning above, so it did not check every entry' >&2; exit 1; fi",
  "cargo fetch --manifest-path examples/github-api/Cargo.toml",
  "cargo audit --db target/advisory-dbs/advisory-db-3157b0e258782691 --no-fetch --deny warnings --file examples/github-api/Cargo.lock 2>target/cargo-audit.stderr || { cat target/cargo-audit.stderr >&2; exit 1; }; cat target/cargo-audit.stderr >&2; if grep -qE 'error|warning' target/cargo-audit.stderr; then echo 'cargo audit exited 0 but printed an error or warning above, so it did not check every entry' >&2; exit 1; fi",
  "cargo fetch --manifest-path examples/petstore/Cargo.toml",
  "cargo audit --db target/advisory-dbs/advisory-db-3157b0e258782691 --no-fetch --deny warnings --file examples/petstore/Cargo.lock 2>target/cargo-audit.stderr || { cat target/cargo-audit.stderr >&2; exit 1; }; cat target/cargo-audit.stderr >&2; if grep -qE 'error|warning' target/cargo-audit.stderr; then echo 'cargo audit exited 0 but printed an error or warning above, so it did not check every entry' >&2; exit 1; fi",
  "cargo fetch --manifest-path examples/petstore-macro/Cargo.toml",
  "cargo audit --db target/advisory-dbs/advisory-db-3157b0e258782691 --no-fetch --deny warnings --file examples/petstore-macro/Cargo.lock 2>target/cargo-audit.stderr || { cat target/cargo-audit.stderr >&2; exit 1; }; cat target/cargo-audit.stderr >&2; if grep -qE 'error|warning' target/cargo-audit.stderr; then echo 'cargo audit exited 0 but printed an error or warning above, so it did not check every entry' >&2; exit 1; fi",
  "cargo deny --all-features --locked check",
  "cargo deny --manifest-path examples/github-api/Cargo.toml --config deny.toml --all-features check",
  "cargo deny --manifest-path examples/petstore/Cargo.toml --config deny.toml --all-features check",
  "cargo deny --manifest-path examples/petstore-macro/Cargo.toml --config deny.toml --all-features check",
]

[tasks.deny-published]
# Audits the `Cargo.lock` that `cargo install spargen --features cli --locked` installs (#178);
# AGENTS.md's "Lockfiles and advisories" says when it runs and who fixes it.
# `the_published_lockfile_audit_covers_every_shipped_binary` pins its shape. The empty `[workspace]`
# appended to the extracted manifest keeps cargo from reading it as a member of this one, and
# `--locked` fails the audit if the shipped lockfile would be rewritten. The `cargo audit`, its
# preceding `cargo fetch` and its warning guard are there for the reasons given under `deny`
# (#187, #414).
description = "Advisory audit of the Cargo.lock the latest spargen release ships on crates.io (needs curl, jq and tar)"
run = [
  '''
rm -rf target/deny-published
mkdir -p target/deny-published/spargen
curl -sSf -A 'getkono/spargen deny-published (https://github.com/getkono/spargen)' -o target/deny-published/crate.json https://crates.io/api/v1/crates/spargen
version=$(jq -er .crate.max_stable_version target/deny-published/crate.json)
curl -sSfL -o target/deny-published/spargen.crate "https://static.crates.io/crates/spargen/spargen-$version.crate"
tar -xzf target/deny-published/spargen.crate -C target/deny-published/spargen --strip-components=1
printf '\n[workspace]\n' >> target/deny-published/spargen/Cargo.toml
echo "auditing the Cargo.lock published in spargen $version"
''',
  "cargo deny fetch db",
  "git -C target/advisory-dbs/advisory-db-3157b0e258782691 log -1 --format='advisory database revision %H (committed %cI)'",
  "cargo fetch --locked --manifest-path target/deny-published/spargen/Cargo.toml",
  "cargo audit --db target/advisory-dbs/advisory-db-3157b0e258782691 --no-fetch --deny warnings --file target/deny-published/spargen/Cargo.lock 2>target/cargo-audit.stderr || { cat target/cargo-audit.stderr >&2; exit 1; }; cat target/cargo-audit.stderr >&2; if grep -qE 'error|warning' target/cargo-audit.stderr; then echo 'cargo audit exited 0 but printed an error or warning above, so it did not check every entry' >&2; exit 1; fi",
  "cargo deny --manifest-path target/deny-published/spargen/Cargo.toml --config deny.toml --all-features --locked check advisories",
]

[tasks.release-preview]
# `release-plz update` has no dry-run mode, so it runs in a clone under `target/` on a fresh local
# branch (it refuses a detached HEAD), and skips LFS smudging, which would fetch from a checkout that
# holds no LFS objects in CI (#190).
description = "Preview the version bumps and CHANGELOG section the next release pull request writes"
run = [
  "rm -rf target/release-preview",
  "GIT_LFS_SKIP_SMUDGE=1 git clone --quiet --no-local . target/release-preview",
  "git -C target/release-preview switch --quiet --create release-preview",
  "cd target/release-preview && GIT_LFS_SKIP_SMUDGE=1 release-plz update --repo-url https://github.com/getkono/spargen",
  "git -C target/release-preview --no-pager diff",
]

[tasks.bench]
description = "Run the generation benchmarks (criterion). CI records these as a workflow artifact on demand and on each spargen release."
# The same bounded warm-up and measurement times `benchmarks.yml` records with, so a local run
# measures what the published artifact measured.
run = "cargo bench --bench generate -- --warm-up-time 1 --measurement-time 3"

[tasks.mutants]
description = "Mutation testing over the runtime, ir/media.rs, the response partition, the name allocator, compat, diag and the small modules their unit tests pin (needs jq)"
# CI's `mutants` job in `mutants.yml` runs these weekly. Beyond the runtime, `ir/` and the
# subsystems above, the scope takes the small modules whose in-module tests constrain them:
# `source/lock.rs`, `source/sha256.rs`, `oas31/lower/shape.rs`, `oas31/lower/defaults.rs`, `emit/`,
# `codegen/docs.rs` and `surface/mod.rs`; and the helpers whose decisions are pure functions
# their unit tests call: `runtime_contract/`, `cache.rs`, `ir/mod.rs`, `ir/invariant.rs`,
# `oas31/media.rs`, `codegen/ty.rs`, `codegen/idents.rs` and `codegen/dispatch.rs`, less the
# build-script environment readers in `cache.rs` and `runtime_contract/integration.rs`, which
# `.cargo/mutants.toml` excludes with its argument. The rest of
# `oas31/`, `codegen/` and `surface/`, and `lib.rs`, stay out because their coverage lives in the
# integration suites, which `--lib` does not run.
# - `--config` names `.cargo/mutants.toml` explicitly, so a missing file fails the run rather than
#   dropping every exclusion.
# - `--all-features` builds the `xml`, `blocking` and `time` modules: a mutant in code the build
#   leaves out compiles, passes every test, and would be reported missed.
# - `-- --lib` runs only the unit tests beside the code in scope; running the integration suites
#   per mutant would take hours, so a mutant only they would catch is reported missed.
# - `|| test $? -eq 3` accepts cargo-mutants' "some mutant timed out": cargo-mutants checks for a
#   timeout before it checks for a missed mutant, so a run with any timeout exits 3 however many it
#   missed (#881). The `jq` line therefore fails the gate on any missed mutant.
run = [
  "cargo mutants --config .cargo/mutants.toml --workspace --all-features --file 'support-runtime/src/**' --file spargen/src/ir/media.rs --file spargen/src/ir/responses.rs --file 'spargen/src/name/**' --file 'spargen/src/compat/**' --file 'spargen/src/diag/**' --file spargen/src/source/lock.rs --file spargen/src/source/sha256.rs --file spargen/src/oas31/lower/shape.rs --file spargen/src/oas31/lower/defaults.rs --file 'spargen/src/emit/**' --file spargen/src/codegen/docs.rs --file spargen/src/surface/mod.rs --file 'spargen/src/runtime_contract/**' --file spargen/src/cache.rs --file spargen/src/ir/mod.rs --file spargen/src/ir/invariant.rs --file spargen/src/oas31/media.rs --file spargen/src/codegen/ty.rs --file spargen/src/codegen/idents.rs --file spargen/src/codegen/dispatch.rs -- --lib || test $? -eq 3",
  "jq -e '.missed == 0' mutants.out/outcomes.json",
]

[tasks.test]
description = "Run the full workspace test suite, including generated-code E2E checks"
run = "cargo test --workspace --all-features"

[tasks.bench-build]
description = "Run each benchmark once in test mode, so its outcome asserts run, as CI's bench-build job does"
# A slow gate pull requests skip, so a task of its own rather than part of `test` (the pre-push hook).
run = "cargo test --benches --workspace"

[tasks.msrv]
description = "Check the workspace and the generated petstore client on the declared rust-version"
# `+1.88.0` rather than a toolchain installed as the default: `rust-toolchain.toml` overrides the
# default toolchain but not an explicit `+toolchain`. Needs `rustup toolchain install 1.88.0`.
run = [
  "cargo +1.88.0 check --workspace --all-features --locked",
  "cargo +1.88.0 check --manifest-path examples/petstore/Cargo.toml",
]

[tasks.package]
description = "Verify the published crates stay self-contained"
# CI's `package` job adds a release-PR-gated macro dry run (`PAIRINGS` in repo_gates/pairing.rs).
# Needs a clean tree.
run = [
  "cargo publish --dry-run -p spargen",
  "cargo package --list -p spargen-macro > /dev/null",
]

[tasks.corpus-smoke]
description = "Run fast corpus smoke checks"
# Each case's expected outcome, and why, is in `corpus/README.md`.
run = [
  "mkdir -p target/corpus-smoke",
  "cargo run -q -p spargen --features cli -- check corpus/github-api-3-0/api.github.com.json --format json > target/corpus-smoke/github-30.json || test $? -eq 1",
  "grep -q E001 target/corpus-smoke/github-30.json",
  # `corpus/github-api-3-1/spargen.toml`, discovered beside the spec, raises the batch cap so the
  # warning volume cannot hide a terminal diagnostic; the output is kept for inspection.
  "cargo run -q -p spargen --features cli -- check corpus/github-api-3-1/api.github.com.json --format json > target/corpus-smoke/github-31.json",
  "cargo run -q -p spargen --features cli -- check corpus/ollama/openapi.yaml --format json",
  "cargo run -q -p spargen --features cli -- check corpus/openapi-boilerplate/src/openapi.yaml --format json",
  # `--batch-cap 100000` raises the cap as `corpus/github-api-3-1/spargen.toml` does for GitHub
  # 3.1: at the default of 100 the warning volume truncates the batch before the terminal E009.
  "cargo run -q -p spargen --features cli -- check corpus/openai-openapi/openapi.yaml --format json --batch-cap 100000 > target/corpus-smoke/openai.json || test $? -eq 1",
  "grep -q E009 target/corpus-smoke/openai.json",
  "cargo run -q -p spargen --features cli -- check corpus/stripe/spec3.json --format json > target/corpus-smoke/stripe.json || test $? -eq 1",
  "grep -q E001 target/corpus-smoke/stripe.json",
  "cargo run -q -p spargen --features cli -- check corpus/twilio-api-2010/twilio_api_v2010.json --format json > target/corpus-smoke/twilio.json || test $? -eq 1",
  "grep -q E001 target/corpus-smoke/twilio.json",
  "cargo run -q -p spargen --features cli -- check corpus/kubernetes-authentication-v1/apis__authentication.k8s.io__v1_openapi.json --format json > target/corpus-smoke/k8s.json || test $? -eq 1",
  "grep -q E001 target/corpus-smoke/k8s.json",
  "cargo run -q -p spargen --features cli -- check corpus/meilisearch/open-api.json --format json > target/corpus-smoke/meili.json || test $? -eq 1",
  "grep -q E011 target/corpus-smoke/meili.json",
  "cargo run -q -p spargen --features cli -- check corpus/mastodon-openapi/schema.json --format json",
]

[tasks.github-api]
description = "Generate and compile the full pinned GitHub API client natively and for wasm"
run = [
  "CARGO_INCREMENTAL=0 CARGO_PROFILE_DEV_DEBUG=0 CARGO_BUILD_JOBS=1 cargo clippy --manifest-path examples/github-api/Cargo.toml --target-dir target/github-api-client --lib --all-features -- -D warnings -W clippy::expect-used",
  "CARGO_INCREMENTAL=0 CARGO_PROFILE_DEV_DEBUG=0 CARGO_BUILD_JOBS=1 cargo check --manifest-path examples/github-api/Cargo.toml --target-dir target/github-api-client --lib --target wasm32-unknown-unknown --all-features",
]

[tasks.example]
description = "Run the end-to-end petstore examples (build.rs + macro) against a local mock server"
run = [
  # The example lockfiles stay TLS-free (#146); read before any cargo call below can rewrite them.
  '''
for lock in examples/petstore/Cargo.lock examples/petstore-macro/Cargo.lock examples/github-api/Cargo.lock; do
  tls=$(grep -En '^name = "([^"]*(rustls|native-tls|openssl|webpki)[^"]*|[^"]*-tls)"$' "$lock" || test $? -eq 1)
  if [ -n "$tls" ]; then
    echo "$lock carries a TLS crate:"; echo "$tls"; exit 1
  fi
done
echo "example lockfiles are TLS-free"
''',
  # build.rs path
  "cargo clippy --manifest-path examples/petstore/Cargo.toml -- -D warnings",
  "cargo run --manifest-path examples/petstore/Cargo.toml",
  # macro path (spargen_macro::generate_api!)
  "cargo clippy --manifest-path examples/petstore-macro/Cargo.toml -- -D warnings",
  "cargo run --manifest-path examples/petstore-macro/Cargo.toml",
  # No spargen crate in the macro consumer's runtime graph.
  '''
leak=$(cargo tree -e no-proc-macro -i spargen --manifest-path examples/petstore-macro/Cargo.toml)
if [ -n "$leak" ]; then
  echo "spargen leaked into the runtime graph:"; echo "$leak"; exit 1
fi
echo "macro runtime graph is spargen-free"
''',
]

[tasks.doc-links]
description = "Rustdoc across the workspace with warnings denied, private items included"
# `--document-private-items` reaches the private subsystem modules; the binary shares its library's
# name, so `--workspace` skips it and the second command documents it.
env = { RUSTDOCFLAGS = "-D warnings" }
run = [
  "cargo doc --no-deps --workspace --all-features --document-private-items",
  "cargo doc --no-deps -p spargen --bin spargen --all-features --document-private-items",
]

[tasks.docs]
description = "Build the mdBook documentation site into docs/book/book (git-ignored) and check its links"
# `mdbook build` checks no link, so the second command checks the built site (`spargen/tests/docs.rs`).
run = [
  "mdbook build docs/book",
  "cargo test -p spargen --test docs every_link_in_the_built_book_resolves -- --exact --ignored",
]

[tasks.commit-msg]
description = "Validate a Conventional Commit message read from stdin (merge commits exempt)"
# During an in-progress merge Git exposes MERGE_HEAD; skip so merge commits stay exempt. The guard
# is an `if` condition, which is exempt from the `errexit` the task shell runs under.
run = "if git rev-parse --verify --quiet MERGE_HEAD >/dev/null; then exit 0; fi; convco check --from-stdin --strip"

[tasks.commit-range]
description = "Validate the outgoing commit range against Conventional Commits"
# convco skips merge commits in a range; CI's `commits` job checks the pull request's range instead.
run = "convco check origin/master..HEAD"

[tasks.hooks]
description = "Install git hooks through mise"
run = "hk install --mise"
