# mise provisions dev tooling and defines the task runner (replacing just/Makefile).
# The Rust toolchain itself is pinned by rust-toolchain.toml.

[tools]
hk = "1.50.0"                               # git hook manager (aqua:jdx/hk)
"cargo:convco" = "0.7.1"                    # Conventional Commit checker
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"  # supply-chain audit
"aqua:rustsec/rustsec/cargo-audit" = "0.22.2"  # advisory + yank audit of every lockfile entry
"cargo:cargo-hack" = "0.6.39"               # feature-combination builds
"cargo:mdbook" = "0.5.4"                    # documentation site builder
"aqua:release-plz/release-plz" = "0.3.160"  # the changelog/version oracle release-plz.yml runs

[tasks.fmt]
description = "Format the whole workspace"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Verify the whole workspace is formatted"
run = "cargo fmt --all --check"

[tasks.lint]
description = "Clippy across the workspace with warnings denied"
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks.lint-fix]
description = "Clippy across the workspace, applying machine-applicable fixes"
run = "cargo clippy --workspace --all-targets --all-features --fix --allow-dirty --allow-staged"

[tasks.check]
description = "Type-check the whole workspace"
run = "cargo check --workspace --all-features"

[tasks.runtime-dependencies]
description = "Resolve generated-runtime dependencies at their declared floors and compile them"
run = "cargo test -p spargen --test e2e runtime_dependency_floors_compile_with_direct_minimal_versions -- --exact --ignored --nocapture"

[tasks.powerset]
description = "Build every feature combination, not just --all-features"
# Every other gate runs `--all-features`, so a combination such as `xml` on and `time` off was
# never compiled — and those are exactly the subsets the generator embeds per spec. `--each-feature`
# adds the none/all ends; the powerset covers the middle for the runtime, where the conditional
# modules live.
run = [
  "cargo hack check --workspace --each-feature --no-dev-deps",
  "cargo hack check -p support-runtime --feature-powerset",
]

[tasks.deny]
# CI's `deny` job runs this command byte for byte, on the cargo-deny version `[tools]` pins
# above (`every_mise_task_runs_exactly_what_its_ci_job_runs` and
# `ci_installs_exactly_the_tool_versions_mise_pins` in spargen/tests/corpus_manifest.rs). `--all-features` is load-bearing: rustls enters the graph
# only under it, so without it an advisory against rustls is clean here and failing there (#141).
# `--locked` audits the committed `Cargo.lock`: without it a skewed lockfile was silently rewritten,
# and a missing one written, and the rewrite was what got audited (#146).
# `the_deny_gate_states_the_feature_scope_it_audits` holds the command to both flags, to a bare
# `check`, and to no graph-narrowing flag.
# The three example workspaces are resolved and compiled by their own gates, and their lockfiles
# carry crates the root resolve never reaches (the wasm-bindgen family among them), so each is
# audited too, under the same `deny.toml` (#184). They take no `--locked`, like every gate that
# compiles them: release-plz bumps the workspace version without refreshing their lockfiles, so
# the `spargen` path-package stamp in them goes stale on every release, and `--locked` would turn
# each release red. What they audit is therefore exactly what those gates compile. The same test
# holds every example workspace to an audit here, with `--config deny.toml`, `--all-features`, and
# a bare `check`.
# cargo-deny audits the graph it activates, not the lockfile: an entry no feature activates (Cargo
# locks the target of a weak `dep?/feature` without enabling it, which is how reqwest puts quinn,
# and through it `rand 0.10` and `chacha20`, into the root `Cargo.lock`) is filtered out and never
# checked, at any feature scope, so a yanked `chacha20 0.10.1` sat in the lockfile under `yanked =
# "deny"` with this audit green (#187). `cargo audit` reads every entry of the file it is given,
# so it runs over each committed lockfile, denying every warning kind (yanked, unmaintained,
# unsound), as `deny.toml`'s `[advisories]` does. It runs over the RustSec checkout cargo-deny
# just fetched into `deny.toml`'s `db-path`, without fetching, after the command that prints that
# checkout's commit: the log of every run names the database revision its advisory verdict was
# reached against. (The `cargo deny check`s after it fetch again, so theirs is that revision or a
# later one.) `the_lockfile_audit_reads_every_committed_lockfile` pins this shape.
description = "Supply-chain audit (licenses, advisories, bans, sources) of every committed lockfile"
run = [
  "cargo deny fetch db",
  "git -C target/advisory-dbs/advisory-db-3157b0e258782691 log -1 --format='advisory database revision %H (committed %cI)'",
  "cargo audit --db target/advisory-dbs/advisory-db-3157b0e258782691 --no-fetch --deny warnings --file Cargo.lock",
  "cargo audit --db target/advisory-dbs/advisory-db-3157b0e258782691 --no-fetch --deny warnings --file examples/github-api/Cargo.lock",
  "cargo audit --db target/advisory-dbs/advisory-db-3157b0e258782691 --no-fetch --deny warnings --file examples/petstore/Cargo.lock",
  "cargo audit --db target/advisory-dbs/advisory-db-3157b0e258782691 --no-fetch --deny warnings --file examples/petstore-macro/Cargo.lock",
  "cargo deny --all-features --locked check",
  "cargo deny --manifest-path examples/github-api/Cargo.toml --config deny.toml --all-features check",
  "cargo deny --manifest-path examples/petstore/Cargo.toml --config deny.toml --all-features check",
  "cargo deny --manifest-path examples/petstore-macro/Cargo.toml --config deny.toml --all-features check",
]

[tasks.deny-published]
# `spargen` has a `[[bin]]`, so its `.crate` ships a `Cargo.lock`, and `cargo install spargen
# --features cli --locked` installs exactly that lockfile's pins. `deny` audits the committed
# lockfile; this audits the published one, which a fix on `master` reaches only when a release
# carries it (#178). The audited release is crates.io's `max_stable_version`, the one a bare
# `cargo install --locked` picks. It is extracted under `target/`, inside this workspace, so the
# empty `[workspace]` appended to its manifest keeps cargo from reading it as a member; that table
# changes no resolution, and `--locked` fails the audit if the shipped lockfile would be rewritten
# (or is missing). CI's `deny-published` job in `deny.yml` runs these commands byte for byte, only
# on the schedule and on `workflow_dispatch`: a pull request cannot change a published artefact, so
# failing one on it would only block the release that carries the fix.
# `the_published_lockfile_audit_covers_every_shipped_binary` pins its shape. As in `deny`, cargo-deny
# checks only the activated graph, so `cargo audit` also reads every entry of the shipped lockfile
# (`cargo install --locked` warns on a yanked one), against the printed database revision (#187).
description = "Advisory audit of the Cargo.lock the latest spargen release ships on crates.io"
run = [
  '''
rm -rf target/deny-published
mkdir -p target/deny-published/spargen
curl -sSf -A 'getkono/spargen deny-published (https://github.com/getkono/spargen)' -o target/deny-published/crate.json https://crates.io/api/v1/crates/spargen
version=$(jq -er .crate.max_stable_version target/deny-published/crate.json)
curl -sSfL -o target/deny-published/spargen.crate "https://static.crates.io/crates/spargen/spargen-$version.crate"
tar -xzf target/deny-published/spargen.crate -C target/deny-published/spargen --strip-components=1
printf '\n[workspace]\n' >> target/deny-published/spargen/Cargo.toml
echo "auditing the Cargo.lock published in spargen $version"
''',
  "cargo deny fetch db",
  "git -C target/advisory-dbs/advisory-db-3157b0e258782691 log -1 --format='advisory database revision %H (committed %cI)'",
  "cargo audit --db target/advisory-dbs/advisory-db-3157b0e258782691 --no-fetch --deny warnings --file target/deny-published/spargen/Cargo.lock",
  "cargo deny --manifest-path target/deny-published/spargen/Cargo.toml --config deny.toml --all-features --locked check advisories",
]

[tasks.release-preview]
# `spargen/CHANGELOG.md` ships inside the published `.crate`, and release-plz's embedded git-cliff
# writes it: which commits it lists is decided by the tool, not by anything committed here (#190).
# This runs that tool, at the version release-plz.yml's action is pinned to run
# (`ci_installs_exactly_the_tool_versions_mise_pins`), and prints what the next release pull
# request would change: the version bumps and the changelog section, so a change's changelog
# impact is read off the log instead of argued. `release-plz update` has no dry-run mode and
# rewrites the tree it runs in, so it runs in a clone under `target/`, which also means it reads
# committed history only (uncommitted edits are not in the preview). The clone's `origin` is a
# local path, so `--repo-url` restores the compare and pull-request links the real run writes.
# LFS content is skipped: no packaged file is an LFS object. Like `deny`, the verdict is not
# hermetic: release-plz compares against the crates.io release and dates the section today. CI's
# `release-preview` job runs these commands byte for byte, so a `release-plz.toml` or commit
# history the release job would choke on fails a pull request rather than `master`.
description = "Preview the version bumps and CHANGELOG section the next release pull request writes"
run = [
  "rm -rf target/release-preview",
  "GIT_LFS_SKIP_SMUDGE=1 git clone --quiet --no-local . target/release-preview",
  "cd target/release-preview && release-plz update --repo-url https://github.com/getkono/spargen",
  "git -C target/release-preview --no-pager diff",
]

[tasks.bench]
description = "Run the generation benchmarks (criterion). CI uploads these as a release artifact."
# The same bounded warm-up and measurement times `benchmarks.yml` records with, so a local run
# measures what the published artifact measured.
run = "cargo bench --bench generate -- --warm-up-time 1 --measurement-time 3"

[tasks.test]
description = "Run the full workspace test suite, including generated-code E2E checks"
run = "cargo test --workspace --all-features"

[tasks.bench-build]
description = "Compile (do not run) the benchmarks, as CI's test job does"
# A task of its own rather than part of `test`: `test` is the pre-push hook, and this is the
# second half of CI's `test` job (`every_mise_task_runs_exactly_what_its_ci_job_runs` holds the
# job to `test` followed by `bench-build`).
run = "cargo bench --no-run --workspace"

[tasks.msrv]
description = "Check the workspace and the generated petstore client on the declared rust-version"
# `+1.88.0` rather than a toolchain installed as the default: `rust-toolchain.toml` overrides the
# default toolchain but not an explicit `+toolchain`. Needs `rustup toolchain install 1.88.0`.
run = [
  "cargo +1.88.0 check --workspace --all-features --locked",
  "cargo +1.88.0 check --manifest-path examples/petstore/Cargo.toml",
]

[tasks.package]
description = "Verify the published crates stay self-contained"
# CI's `package` job also runs `cargo publish --dry-run -p spargen-macro` against the workspace
# `spargen`, but only outside release-plz PRs; that step stays CI-only (see the `package` row of
# `PAIRINGS` in spargen/tests/corpus_manifest.rs). `cargo publish --dry-run` refuses a dirty tree,
# as it would in CI's fresh checkout.
run = [
  "cargo publish --dry-run -p spargen",
  "cargo package --list -p spargen-macro > /dev/null",
]

[tasks.corpus-smoke]
description = "Run fast corpus smoke checks"
# Each entry is, byte for byte, a `run:` step of CI's `corpus-smoke` job
# (`every_mise_task_runs_exactly_what_its_ci_job_runs`). mise runs each entry under
# `sh -c -o errexit`, as CI runs each step under `bash -e`, so a `check` that exits with anything
# but 0 or 1 fails the entry before its `grep` runs.
run = [
  "mkdir -p target/corpus-smoke",
  "cargo run -q -p spargen --features cli -- check corpus/github-api-3-0/api.github.com.json --format json > target/corpus-smoke/github-30.json || test $? -eq 1",
  "grep -q E001 target/corpus-smoke/github-30.json",
  # The current exact GitHub 3.1 pin must clear the strict frontend without carve/omits.
  "cargo run -q -p spargen --features cli -- check corpus/github-api-3-1/api.github.com.json --format json --config corpus/github-api-3-1/spargen.toml > target/corpus-smoke/github-31.json",
  "cargo run -q -p spargen --features cli -- check corpus/ollama/openapi.yaml --format json",
  "cargo run -q -p spargen --features cli -- check corpus/openapi-boilerplate/src/openapi.yaml --format json",
  # 3.1 and past the version gate, but `POST /realtime/calls` documents `application/sdp` as its
  # only 201 content entry and spargen has no codec for an unregistered media type. The cap is
  # raised for the same reason as GitHub 3.1: at the default of 100 the warning volume truncates
  # the batch before the terminal E009 is reached.
  "cargo run -q -p spargen --features cli -- check corpus/openai-openapi/openapi.yaml --format json --batch-cap 100000 > target/corpus-smoke/openai.json || test $? -eq 1",
  "grep -q E009 target/corpus-smoke/openai.json",
  # 3.0.x/3.0.1/3.0.0 real-world APIs: rejected at the version gate (E001).
  "cargo run -q -p spargen --features cli -- check corpus/stripe/spec3.json --format json > target/corpus-smoke/stripe.json || test $? -eq 1",
  "grep -q E001 target/corpus-smoke/stripe.json",
  "cargo run -q -p spargen --features cli -- check corpus/twilio-api-2010/twilio_api_v2010.json --format json > target/corpus-smoke/twilio.json || test $? -eq 1",
  "grep -q E001 target/corpus-smoke/twilio.json",
  "cargo run -q -p spargen --features cli -- check corpus/kubernetes-authentication-v1/apis__authentication.k8s.io__v1_openapi.json --format json > target/corpus-smoke/k8s.json || test $? -eq 1",
  "grep -q E001 target/corpus-smoke/k8s.json",
  # meilisearch is 3.1.0 and clears the version gate, but its null externalDocs descriptions fail
  # the official 3.1 document schema before lowering.
  "cargo run -q -p spargen --features cli -- check corpus/meilisearch/open-api.json --format json > target/corpus-smoke/meili.json || test $? -eq 1",
  "grep -q E011 target/corpus-smoke/meili.json",
]

[tasks.github-api]
description = "Generate and compile the full pinned GitHub API client natively and for wasm"
run = [
  "CARGO_INCREMENTAL=0 CARGO_PROFILE_DEV_DEBUG=0 CARGO_BUILD_JOBS=1 cargo clippy --manifest-path examples/github-api/Cargo.toml --target-dir target/github-api-client --lib --all-features -- -D warnings -W clippy::expect-used",
  "CARGO_INCREMENTAL=0 CARGO_PROFILE_DEV_DEBUG=0 CARGO_BUILD_JOBS=1 cargo check --manifest-path examples/github-api/Cargo.toml --target-dir target/github-api-client --lib --target wasm32-unknown-unknown --all-features",
]

[tasks.example]
description = "Run the end-to-end petstore examples (build.rs + macro) against a local mock server"
run = [
  # Every example workspace's committed lockfile stays TLS-free: deny.toml reasons about TLS
  # advisories on the premise that generated output carries its own default-features-off reqwest,
  # and this is what holds that premise (#146). It reads the lockfiles before any cargo call below
  # can rewrite them. `|| test $? -eq 1` lets grep's no-match through and keeps its error fatal, so
  # a missing lockfile fails rather than passing as TLS-free. The script is CI's step verbatim.
  '''
for lock in examples/petstore/Cargo.lock examples/petstore-macro/Cargo.lock examples/github-api/Cargo.lock; do
  tls=$(grep -En '^name = "([^"]*(rustls|native-tls|openssl|webpki)[^"]*|[^"]*-tls)"$' "$lock" || test $? -eq 1)
  if [ -n "$tls" ]; then
    echo "$lock carries a TLS crate:"; echo "$tls"; exit 1
  fi
done
echo "example lockfiles are TLS-free"
''',
  # build.rs path
  "cargo clippy --manifest-path examples/petstore/Cargo.toml -- -D warnings",
  "cargo run --manifest-path examples/petstore/Cargo.toml",
  # macro path (spargen_macro::generate_api!)
  "cargo clippy --manifest-path examples/petstore-macro/Cargo.toml -- -D warnings",
  "cargo run --manifest-path examples/petstore-macro/Cargo.toml",
  # The macro path must keep spargen out of the consumer's RUNTIME graph — a proc-macro crate and
  # everything it reaches are host-only. `-i spargen` under `-e no-proc-macro` prints nothing to
  # stdout when spargen is absent from the pruned graph; a non-empty print means it leaked in.
  # The script is CI's step verbatim, so a failing `cargo tree` fails here as it fails there.
  '''
leak=$(cargo tree -e no-proc-macro -i spargen --manifest-path examples/petstore-macro/Cargo.toml)
if [ -n "$leak" ]; then
  echo "spargen leaked into the runtime graph:"; echo "$leak"; exit 1
fi
echo "macro runtime graph is spargen-free"
''',
]

[tasks.doc-links]
description = "Rustdoc across the workspace with warnings denied, private items included"
# `--document-private-items` is the point: every subsystem module is private, so a plain
# `cargo doc` documents none of them and link-checks none of them. Without this flag the whole
# internal doc surface — which is most of the crate — is unchecked, and stale links accumulate
# invisibly. `--no-deps` keeps it to this workspace.
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --no-deps --workspace --all-features --document-private-items"

[tasks.docs]
description = "Build the mdBook documentation site into docs/book/book (git-ignored)"
# mdBook is pinned in `[tools]` above, so this uses the same version CI does. Fails on broken
# includes/links.
run = "mdbook build docs/book"

[tasks.commit-msg]
description = "Validate a Conventional Commit message read from stdin (merge commits exempt)"
# During an in-progress merge Git exposes MERGE_HEAD; skip so merge commits stay exempt. The guard
# is an `if` condition, which is exempt from the `errexit` the task shell runs under.
run = "if git rev-parse --verify --quiet MERGE_HEAD >/dev/null; then exit 0; fi; convco check --from-stdin --strip"

[tasks.commit-range]
description = "Validate the outgoing commit range against Conventional Commits"
# convco skips merge commits by default for revwalks (do not add --merges). CI's `commits` job
# runs this command with the pull request's `base.sha..head.sha` in place of `origin/master..HEAD`;
# that range is the one named difference `every_mise_task_runs_exactly_what_its_ci_job_runs`
# allows, and it holds everything else in the command identical.
run = "convco check origin/master..HEAD"

[tasks.hooks]
description = "Install git hooks through mise"
run = "hk install --mise"
