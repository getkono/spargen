[package]
name = "spargen-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Excluded from the root workspace; README.md says why and how to run it.
[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tempfile = "3"
camino = "1"
# The generator under test, with no features: the frontend needs none, and the target drives only
# `spargen::check`.
spargen = { path = "../spargen" }

[[bin]]
name = "frontend"
path = "fuzz_targets/frontend.rs"
test = false
doc = false
bench = false

# libFuzzer targets are built in release with debug assertions kept on, so overflow/index panics the
# fuzzer is meant to catch still fire.
[profile.release]
debug = 1
debug-assertions = true
overflow-checks = true
