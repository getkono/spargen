[package]
name = "support-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Freestanding runtime embedded into spargen-generated clients. Not published."
publish = false

# The runtime is embedded verbatim into generated output. Its dependency
# surface is the audited set used by generated clients — no spargen crate, and nothing
# project-specific. Generated models may additionally reference the separately audited `uuid`
# dependency; this crate holds only the embedded runtime, not those models. Each feature below is
# off by default and gates one conditionally embedded module; the comment on that module's `mod`
# in src/lib.rs says what it adds and when a generated client carries it.
[features]
xml = ["dep:quick-xml"]
blocking = ["dep:tokio"]
time = ["dep:time"]

[dependencies]
reqwest = { workspace = true, features = ["stream"] }
futures-core.workspace = true
serde.workspace = true
serde_json.workspace = true
bytes.workspace = true
secrecy.workspace = true
quick-xml = { workspace = true, features = ["serialize"], optional = true }
# A current-thread runtime is enough to `block_on` the async operation futures; only the `rt`
# feature is needed directly (reqwest brings tokio's net/time drivers, which feature unification
# folds in so `enable_all()` wires up a working reactor).
tokio = { workspace = true, features = ["rt"], optional = true }
# Only `formatting`/`parsing` are needed: the RFC 3339 rendering is hand-written in `datetime.rs`
# rather than delegated to `time/serde`, whose representation is not RFC 3339 with or without its
# `serde-human-readable` feature. Keeping `serde` off is what makes that impossible to regress into.
time = { workspace = true, features = ["formatting", "parsing"], optional = true }

# Test-only: synthesize in-memory `reqwest::Response`s (via `http::Response`) to exercise the body
# readers with a poll-once noop waker — no async runtime, and never embedded (the test module is
# stripped at embed time).
[dev-dependencies]
http = "1"
# The runtime itself needs only serde's runtime traits; the test module derives `Deserialize` on
# throwaway payload structs, so the `derive` feature is pulled in for the test build only.
serde = { workspace = true, features = ["derive"] }
# Test-only: the percent-encoding and dot-segment laws are checked as properties over their input
# space. A dev-dependency never reaches the embedded runtime or a consumer's graph.
proptest.workspace = true
