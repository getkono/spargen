[package]
name = "support-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Freestanding runtime embedded into spargen-generated clients. Not published."
publish = false

# AGENTS.md's Workspace section names the dependency set this runtime may carry (generated models
# may also reference `uuid`, which this crate does not carry). Each feature gates
# one conditionally embedded module; the comment on its `mod` in src/lib.rs says when a client
# carries it.
[features]
stream = ["reqwest/stream", "dep:futures-core"]
xml = ["dep:quick-xml"]
blocking = ["dep:tokio"]
time = ["dep:time"]
jiff = ["dep:jiff"]
chrono = ["dep:chrono"]

[dependencies]
# The transport seam's currency: `HttpBackend` takes an `http::Request` and answers an
# `http::Response`, whose body is the runtime's own `HttpBody`, an `http_body::Body`.
http.workspace = true
http-body.workspace = true
reqwest.workspace = true
futures-core = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
bytes.workspace = true
secrecy.workspace = true
quick-xml = { workspace = true, features = ["serialize"], optional = true }
# A current-thread runtime is enough to `block_on` the async operation futures; only the `rt`
# feature is needed directly (reqwest brings tokio's net/time drivers, which feature unification
# folds in so `enable_all()` wires up a working reactor).
tokio = { workspace = true, features = ["rt"], optional = true }
# Only `formatting`/`parsing` are needed: the RFC 3339 rendering is hand-written in `datetime.rs`
# rather than delegated to `time/serde`, whose representation is not RFC 3339 with or without its
# `serde-human-readable` feature. Keeping `serde` off is what makes that impossible to regress into.
time = { workspace = true, features = ["formatting", "parsing"], optional = true }
# The other two date-time backends need no feature of their crate: the RFC 3339 text is read and
# written by `rfc3339.rs`, and only each crate's calendar types and conversions are used.
jiff = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }

[dev-dependencies]
# Test-only: the shared scripted response body (`Chunks` in src/lib.rs) is a `futures_core::Stream`
# wrapped through reqwest's `stream` feature, and every module's tests read bodies through it, not
# only the `stream` module's.
futures-core.workspace = true
reqwest = { workspace = true, features = ["stream"] }
# The runtime itself needs only serde's runtime traits; the test module derives `Deserialize` on
# throwaway payload structs, so the `derive` feature is pulled in for the test build only.
serde = { workspace = true, features = ["derive"] }
# Test-only: the percent-encoding and dot-segment laws are checked as properties over their input
# space. A dev-dependency never reaches the embedded runtime or a consumer's graph.
proptest.workspace = true
# Test-only: counts the heap allocations parameter and query serialisation make, which is the
# evidence their single-buffer joins stay single-buffer. It installs a counting global allocator
# in the test binary alone (the `unsafe` it needs is its own; this crate forbids `unsafe`).
allocation-counter.workspace = true
