# AGENTS.md's Releases section says how release-plz drives releases; its defaults tag each published
# crate and create a GitHub release. CHANGELOG.md is written by release-plz's embedded git-cliff;
# do not add a cliff.toml.

# The freestanding runtime is embedded via include_str! and never released as its own crate
# (`publish = false` in its manifest keeps it off crates.io too).
[[package]]
name = "support-runtime"
release = false
# release-plz defaults `publish` to true and refuses a config that contradicts the manifest's
# `publish = false`, so `release = false` alone fails every `release-plz release` run.
publish = false
