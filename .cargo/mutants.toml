# cargo-mutants configuration. `mise run mutants` and the `mutants` job in
# `.github/workflows/mutants.yml` pass `--config .cargo/mutants.toml`; the comment on
# `[tasks.mutants]` in `mise.toml` says what the command scopes and why.
#
# Every `exclude_re` entry is a mutant no test in the run can observe, so the run could never kill
# it: an equivalent mutant, or one in code the run cannot reach (compiled only for `wasm32`, or
# whose only input or output is the process environment or standard output). Each carries its argument here, and the same argument sits beside the code as a
# `// Mutation testing:` comment. A mutant a test could observe but none does is never excluded: it
# is killed with a test. The `mutants` crate's `#[mutants::skip]` is not used because everything
# above a runtime file's `#[cfg(test)]` marker is embedded into generated code, which must not
# depend on it.
#
# The patterns match the names `cargo mutants --list` prints, which start with
# `<file>:<line>:<column>: `.
exclude_re = [
  # `support-runtime/src/transport.rs`, `FetchBody` and `HttpBody::into_fetch_response`, and
  # `support-runtime/src/stream.rs`, `FetchChunks`: how `ReqwestBackend`'s response body is read
  # on `wasm32`, compiled only for `target_arch = "wasm32"`, so no native test reaches them; on
  # `wasm32` the runtime is compile-checked by `mise run github-api`, not tested. Their names are
  # unique to them, so the patterns name them rather than a line.
  '^support-runtime/src/transport\.rs:\d+:\d+: replace <impl http_body::Body for FetchBody>::poll_frame -> ',
  '^support-runtime/src/transport\.rs:\d+:\d+: replace HttpBody::into_fetch_response -> ',
  '^support-runtime/src/transport\.rs:\d+:\d+: delete match arm .* in HttpBody::into_fetch_response$',
  '^support-runtime/src/stream\.rs:\d+:\d+: replace <impl http_body::Body for FetchChunks>::poll_frame -> ',
  # `support-runtime/src/paginate.rs`, the guard on `split_outside`'s `>` arm: whenever
  # `respect_angles && !in_quote` is false, `in_angle` is already false, so the arm's
  # `in_angle = false` changes nothing and no input can tell the guard from `true` (or its `&&` from
  # `||`). Only the `<` arm sets `in_angle`, and it needs `respect_angles`; a quoted string opens
  # only outside `<…>`, and inside one the `<` arm sets nothing. The `<` arm carries the same
  # guard text and is tested, so the pattern is anchored on the `>` arm's line and columns; once
  # an edit moves the line the pattern matches nothing and the mutants fail the run as missed
  # until it is updated, rather than excluding whatever moved onto that line.
  '^support-runtime/src/paginate\.rs:238:21: replace match guard respect_angles && !in_quote with true in split_outside$',
  '^support-runtime/src/paginate\.rs:238:36: replace && with \|\| in split_outside$',
  # `support-runtime/src/stream.rs`, `sse_next`'s `buffer.line_start < buffer.len()` to `<=`: at
  # `line_start == len` the field appended is the empty line, whose empty name matches no field,
  # so `append_sse_field` leaves the event's fields as they were. The entry is anchored on line and
  # column like the ones above, so an edit that moves it fails the run instead of excluding another
  # comparison of the same kind in the same function.
  '^support-runtime/src/stream\.rs:732:38: replace < with <= in sse_next$',
  # `support-runtime/src/error.rs`, `ApiErrorBody::body`, `ApiErrorBody::into_body` and
  # `ApiErrorProblem::problem` for `std::convert::Infallible`: the type is uninhabited, so no
  # `self` exists to call any of them with, and no test or caller can observe what they return.
  '^support-runtime/src/error\.rs:\d+:\d+: replace <impl ApiErrorBody for std::convert::Infallible>::body -> ',
  '^support-runtime/src/error\.rs:\d+:\d+: replace <impl ApiErrorBody for std::convert::Infallible>::into_body -> ',
  '^support-runtime/src/error\.rs:\d+:\d+: replace <impl ApiErrorProblem for std::convert::Infallible>::problem -> ',
  # `spargen/src/source/sha256.rs`, `Sha256::update`'s `self.buffered > 0` to `>=`: from an empty
  # block the branch then copies up to 64 bytes into it, returning with them buffered when fewer
  # arrived (what the tail copy below would buffer) and otherwise compressing the full block (the
  # block the loop below would compress first) and emptying it. Only the number of bytes copied
  # differs, never a digest. Anchored on line and column like the entries above.
  '^spargen/src/source/sha256\.rs:60:26: replace > with >= in Sha256::update$',
  # `spargen/src/source/sha256.rs`, `compress`'s choice function `ch = (e & f) ^ ((!e) & g)` with
  # its `^` replaced by `|`: the two terms never share a set bit (a bit of `e` is set in the first
  # only, clear in the second only), and the xor of two such words is their or.
  '^spargen/src/source/sha256\.rs:121:26: replace \^ with \| in compress$',
  # `spargen/src/source/sha256.rs`, `compress`'s majority function
  # `maj = (a & b) ^ (a & c) ^ (b & c)` with either `^` replaced by `|`. The mutant replaces the
  # token, so the precedence of `&` over `^` over `|` regroups what is left, and each result is
  # another form of the bitwise majority:
  # - the first: `(a & b) | (a & c) ^ (b & c)` parses as `(a & b) | (c & (a ^ b))`, set where `a`
  #   and `b` both are, or where exactly one of them is and `c` is;
  # - the second: `(a & b) ^ (a & c) | (b & c)` differs from the xor only where both
  #   `(a & b) ^ (a & c)` and `b & c` are set, and wherever `b` and `c` are both set, `a & b`
  #   equals `a & c`, so their xor is clear there.
  '^spargen/src/source/sha256\.rs:133:27: replace \^ with \| in compress$',
  '^spargen/src/source/sha256\.rs:133:37: replace \^ with \| in compress$',
  # `spargen/src/oas31/media.rs`, `media_type_with_parameters`'s `at += 1` on the `;` that ends a
  # parameter, replaced by `*=`: `at` then stays on that `;`, and the loop's head, which skips
  # optional whitespace and then each `;` it finds, steps over it the same way before reading the
  # next parameter, so the canonical form and every fault are unchanged. Anchored on line and
  # column like the entries above: the loop head's own `at += 1` is tested and stays in the run.
  '^spargen/src/oas31/media\.rs:312:30: replace \+= with \*= in media_type_with_parameters$',
  # The build-script environment readers: `spargen/src/cache.rs`, `cache_dir` (`OUT_DIR`), and
  # `spargen/src/runtime_contract/integration.rs`, `under_build_script` (`OUT_DIR` and
  # `CARGO_CFG_TARGET_ARCH`), `build_script_manifest` and `manifest_from_env`
  # (`CARGO_MANIFEST_PATH` and `CARGO_MANIFEST_DIR`), `cargo_home` (`CARGO_HOME` and the home
  # directory), and `print_rerun`, which writes its directives to standard output. A `--lib` test
  # could observe them only by setting process-wide environment variables that every test running
  # beside it reads, or by reading the output the test harness captures. Each is a reader over a
  # pure function the unit tests pin (`manifest_from`, `resolve_cargo_environment`,
  # `cargo_home_from`, `rerun_if_changed_lines`, and
  # `pipeline::generate_with_cache_dir`, which takes the cache directory as an argument), and
  # `spargen/tests/e2e/manifest_audit.rs` runs them from a real build script. Only the mutants the
  # suite misses are named: replacing `under_build_script` with `true` or its `&&` with `||`, or
  # `build_script_manifest` with `Some(…)`, is killed and stays in the run. The names are unique,
  # so the patterns name them rather than a line.
  '^spargen/src/cache\.rs:\d+:\d+: replace cache_dir -> Option<Utf8PathBuf> with ',
  '^spargen/src/runtime_contract/integration\.rs:\d+:\d+: replace under_build_script -> bool with false$',
  '^spargen/src/runtime_contract/integration\.rs:\d+:\d+: replace build_script_manifest -> Option<Utf8PathBuf> with None$',
  '^spargen/src/runtime_contract/integration\.rs:\d+:\d+: replace manifest_from_env -> Option<Utf8PathBuf> with ',
  '^spargen/src/runtime_contract/integration\.rs:\d+:\d+: replace cargo_home -> Option<Utf8PathBuf> with ',
  '^spargen/src/runtime_contract/integration\.rs:\d+:\d+: replace print_rerun with \(\)$',
]
