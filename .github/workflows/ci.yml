name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A push to `master` gets a group of its own commit, so the next merge never cancels the slow gates
# pull requests skip; a pull request's newer push still cancels its older run.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      # The wasm32 target is what `generated_crate_compiles_for_wasm32_browser_target` compiles
      # for; without it that test fails here rather than skipping (it skips only off CI).
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  bench-build:
    name: Benchmarks (test mode)
    # A slow gate pull requests skip (.claude/rules/ci-gates.md; `SLOW_GATE_IF` in repo_gates/pairing.rs).
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release-plz-')
    runs-on: ubuntu-latest
    steps:
      # The `ollama` benchmark input lives in the LFS-backed corpus.
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      # Each benchmark once, untimed, so its `Outcome` asserts run; the timed run is benchmarks.yml.
      - run: cargo test --benches --workspace

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  msrv:
    name: MSRV
    # A slow gate pull requests skip (.claude/rules/ci-gates.md; `SLOW_GATE_IF` in repo_gates/pairing.rs).
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release-plz-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # `+1.88.0` outranks `rust-toolchain.toml`, which would otherwise select the pinned release.
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.88.0 check --workspace --all-features --locked
      # The generated petstore client's floor; unlocked like every example gate.
      - run: cargo +1.88.0 check --manifest-path examples/petstore/Cargo.toml

  powerset:
    name: Feature combinations
    # A slow gate pull requests skip (.claude/rules/ci-gates.md; `SLOW_GATE_IF` in repo_gates/pairing.rs).
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release-plz-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      # The version is `[tools]`'s in mise.toml: `@cargo-hack` as the ref would install the newest
      # release instead (`ci_installs_exactly_the_tool_versions_mise_pins`).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack@0.6.39
      # `mise run powerset`'s comment says what each line covers.
      - run: cargo hack check --workspace --each-feature --no-dev-deps
      - run: cargo hack check -p support-runtime --no-dev-deps --feature-powerset
      - run: cargo hack check --workspace --exclude support-runtime --each-feature --all-targets
      - run: cargo hack check -p support-runtime --all-targets --feature-powerset

  runtime-dependencies:
    name: Runtime dependency floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The one floating toolchain, named in `TOOLCHAIN_EXCEPTIONS`: `-Z direct-minimal-versions`
      # needs a nightly cargo, and the proof only resolves the lockfile with it.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p spargen --test e2e runtime_dependency_floors_compile_with_direct_minimal_versions -- --exact --ignored --nocapture

  package:
    name: Package (self-contained)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      # The runtime sources reached through symlinks must ship inside the crate and compile there.
      - run: cargo publish --dry-run -p spargen
      # On a release (its pull request, or the `chore: release` commit it merges as) the macro's
      # registry dependency is not published yet, so only its package contents are checked.
      - run: cargo package --list -p spargen-macro > /dev/null
      - if: >-
          (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-plz-')) ||
          (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: release'))
        run: cargo publish --dry-run -p spargen-macro --config 'patch.crates-io.spargen.path="spargen"'

  corpus-smoke:
    name: Corpus smoke
    # A slow gate pull requests skip (.claude/rules/ci-gates.md; `SLOW_GATE_IF` in repo_gates/pairing.rs).
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release-plz-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      # Each case's expected outcome, and why, is in `corpus/README.md`.
      - run: mkdir -p target/corpus-smoke
      - run: cargo run -q -p spargen --features cli -- check corpus/github-api-3-0/api.github.com.json --format json > target/corpus-smoke/github-30.json || test $? -eq 1
      - run: grep -q E001 target/corpus-smoke/github-30.json
      # `corpus/github-api-3-1/spargen.toml`, discovered beside the spec, raises the batch cap so the
      # warning volume cannot hide a terminal diagnostic; the output is kept for inspection.
      - run: cargo run -q -p spargen --features cli -- check corpus/github-api-3-1/api.github.com.json --format json > target/corpus-smoke/github-31.json
      - run: cargo run -q -p spargen --features cli -- check corpus/ollama/openapi.yaml --format json
      - run: cargo run -q -p spargen --features cli -- check corpus/openapi-boilerplate/src/openapi.yaml --format json
      # `--batch-cap 100000` raises the cap as `corpus/github-api-3-1/spargen.toml` does for GitHub
      # 3.1: at the default of 100 the warning volume truncates the batch before the terminal E009.
      - run: cargo run -q -p spargen --features cli -- check corpus/openai-openapi/openapi.yaml --format json --batch-cap 100000 > target/corpus-smoke/openai.json || test $? -eq 1
      - run: grep -q E009 target/corpus-smoke/openai.json
      - run: cargo run -q -p spargen --features cli -- check corpus/stripe/spec3.json --format json > target/corpus-smoke/stripe.json || test $? -eq 1
      - run: grep -q E001 target/corpus-smoke/stripe.json
      - run: cargo run -q -p spargen --features cli -- check corpus/twilio-api-2010/twilio_api_v2010.json --format json > target/corpus-smoke/twilio.json || test $? -eq 1
      - run: grep -q E001 target/corpus-smoke/twilio.json
      - run: cargo run -q -p spargen --features cli -- check corpus/kubernetes-authentication-v1/apis__authentication.k8s.io__v1_openapi.json --format json > target/corpus-smoke/k8s.json || test $? -eq 1
      - run: grep -q E001 target/corpus-smoke/k8s.json
      - run: cargo run -q -p spargen --features cli -- check corpus/meilisearch/open-api.json --format json > target/corpus-smoke/meili.json || test $? -eq 1
      - run: grep -q E011 target/corpus-smoke/meili.json
      - run: cargo run -q -p spargen --features cli -- check corpus/mastodon-openapi/schema.json --format json

  github-api:
    name: GitHub API generated client
    # A slow gate pull requests skip (.claude/rules/ci-gates.md; `SLOW_GATE_IF` in repo_gates/pairing.rs).
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release-plz-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: CARGO_INCREMENTAL=0 CARGO_PROFILE_DEV_DEBUG=0 CARGO_BUILD_JOBS=1 cargo clippy --manifest-path examples/github-api/Cargo.toml --target-dir target/github-api-client --lib --all-features -- -D warnings -W clippy::expect-used
      - run: CARGO_INCREMENTAL=0 CARGO_PROFILE_DEV_DEBUG=0 CARGO_BUILD_JOBS=1 cargo check --manifest-path examples/github-api/Cargo.toml --target-dir target/github-api-client --lib --target wasm32-unknown-unknown --all-features

  example:
    name: Petstore example
    # A slow gate pull requests skip (.claude/rules/ci-gates.md; `SLOW_GATE_IF` in repo_gates/pairing.rs).
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release-plz-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            examples/petstore
            examples/petstore-macro
      # First, before any cargo call can rewrite a lockfile (#146).
      - name: Assert example lockfiles are TLS-free
        run: |
          for lock in examples/petstore/Cargo.lock examples/petstore-macro/Cargo.lock examples/github-api/Cargo.lock; do
            tls=$(grep -En '^name = "([^"]*(rustls|native-tls|openssl|webpki)[^"]*|[^"]*-tls)"$' "$lock" || test $? -eq 1)
            if [ -n "$tls" ]; then
              echo "$lock carries a TLS crate:"; echo "$tls"; exit 1
            fi
          done
          echo "example lockfiles are TLS-free"
      # build.rs path
      - run: cargo clippy --manifest-path examples/petstore/Cargo.toml -- -D warnings
      - run: cargo run --manifest-path examples/petstore/Cargo.toml
      # macro path (spargen_macro::generate_api!)
      - run: cargo clippy --manifest-path examples/petstore-macro/Cargo.toml -- -D warnings
      - run: cargo run --manifest-path examples/petstore-macro/Cargo.toml
      - name: Assert macro runtime graph is spargen-free
        run: |
          leak=$(cargo tree -e no-proc-macro -i spargen --manifest-path examples/petstore-macro/Cargo.toml)
          if [ -n "$leak" ]; then
            echo "spargen leaked into the runtime graph:"; echo "$leak"; exit 1
          fi
          echo "macro runtime graph is spargen-free"

  docs:
    name: Docs site (mdBook)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      # The version is `[tools]`'s in mise.toml (`ci_installs_exactly_the_tool_versions_mise_pins`).
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4
      - run: mdbook build docs/book
      - run: cargo test -p spargen --test docs every_link_in_the_built_book_resolves -- --exact --ignored
      # `mise run docs` and `mise run doc-links` say why each of these steps is there.
      - name: Rustdoc link check
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace --all-features --document-private-items
      - name: Rustdoc link check (spargen binary)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps -p spargen --bin spargen --all-features --document-private-items

  release-preview:
    name: Release preview (release-plz)
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: release-plz reads every commit since the last release's tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.1
      # The pin release-plz.yml's action also runs (`ci_installs_exactly_the_tool_versions_mise_pins`).
      - uses: taiki-e/install-action@v2
        with:
          tool: release-plz@0.3.160
      # The version bumps and CHANGELOG section the next release pull request would write (#190).
      - run: rm -rf target/release-preview
      - run: GIT_LFS_SKIP_SMUDGE=1 git clone --quiet --no-local . target/release-preview
      - run: git -C target/release-preview switch --quiet --create release-preview
      - run: cd target/release-preview && GIT_LFS_SKIP_SMUDGE=1 release-plz update --repo-url https://github.com/getkono/spargen
      - run: git -C target/release-preview --no-pager diff

  # The `deny` job lives in deny.yml, which runs it on the same triggers plus a daily schedule.

  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The version is `[tools]`'s in mise.toml (`ci_installs_exactly_the_tool_versions_mise_pins`).
      - uses: taiki-e/install-action@v2
        with:
          tool: convco@0.7.1
      - name: Check commits
        run: convco check ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
