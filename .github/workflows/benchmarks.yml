name: Benchmarks

# A record, not a gate: on demand, and once per `spargen` release, dispatched by `release-plz.yml`
# because a tag pushed with `GITHUB_TOKEN` starts no workflow (#685).
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: Generation benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The `ollama` benchmark input lives in the LFS-backed corpus.
          lfs: true
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      # `pipefail`, or a failing `cargo bench` would exit through `tee` with status 0.
      - name: Run generation benchmarks
        run: |
          set -o pipefail
          cargo bench --bench generate -- --warm-up-time 1 --measurement-time 3 | tee bench-results.txt
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-${{ github.ref_name }}
          # The captured summary plus criterion's full statistics/report tree.
          path: |
            bench-results.txt
            target/criterion/**
          if-no-files-found: error
