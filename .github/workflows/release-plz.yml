name: Release-plz
on:
  push:
    branches:
      - master
jobs:
  # Release unpublished packages.
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      # OIDC: mint a short-lived crates.io token via Trusted Publishing — no stored registry token.
      id-token: write
    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - &install-rust
        name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
      - name: Authenticate to crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Run release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
          # The `[tools]` pin in mise.toml, so `mise run release-preview` runs this binary
          # (`ci_installs_exactly_the_tool_versions_mise_pins`).
          version: 0.3.160
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Create a PR with the new versions and changelog, preparing the next release.
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - *checkout
      - *install-rust
      - name: Run release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
          # The `[tools]` pin in mise.toml, so `mise run release-preview` previews this binary's
          # output (`ci_installs_exactly_the_tool_versions_mise_pins`).
          version: 0.3.160
        env:
          # release-pr only opens the version-bump PR; it never publishes, so no registry token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
