name: Supply chain

# The audit's verdict depends on when it runs, not only on what is committed, so the daily run
# finds a new advisory on `master` itself rather than on an unrelated pull request; AGENTS.md's
# "Lockfiles and advisories" says why and who responds. The `deny` job is the same gate pull
# requests and pushes run, in its own workflow so the schedule re-runs only it; `deny-published`
# audits the lockfile the latest release ships, on the schedule only.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: deny-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      # The cargo-deny and cargo-audit versions `[tools]` pins in mise.toml, not the copy an action bundles: the
      # action's version moved with its `@v2` ref and nothing held it to the pin (#228), and its
      # inputs composed an argv this repository could only partly state (#229).
      # `ci_installs_exactly_the_tool_versions_mise_pins` holds the version here to the pin.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      # `mise run deny`'s commands, byte for byte
      # (`every_mise_task_runs_exactly_what_its_ci_job_runs`); the comment on `[tasks.deny]` in
      # mise.toml says why each one is there.
      - run: cargo deny fetch db
      - run: git -C target/advisory-dbs/advisory-db-3157b0e258782691 log -1 --format='advisory database revision %H (committed %cI)'
      - run: cargo fetch --locked
      - run: cargo audit --db target/advisory-dbs/advisory-db-3157b0e258782691 --no-fetch --deny warnings --file Cargo.lock 2>target/cargo-audit.stderr || { cat target/cargo-audit.stderr >&2; exit 1; }; cat target/cargo-audit.stderr >&2; if grep -qE 'error|warning' target/cargo-audit.stderr; then echo 'cargo audit exited 0 but printed an error or warning above, so it did not check every entry' >&2; exit 1; fi
      - run: cargo fetch --manifest-path examples/github-api/Cargo.toml
      - run: cargo audit --db target/advisory-dbs/advisory-db-3157b0e258782691 --no-fetch --deny warnings --file examples/github-api/Cargo.lock 2>target/cargo-audit.stderr || { cat target/cargo-audit.stderr >&2; exit 1; }; cat target/cargo-audit.stderr >&2; if grep -qE 'error|warning' target/cargo-audit.stderr; then echo 'cargo audit exited 0 but printed an error or warning above, so it did not check every entry' >&2; exit 1; fi
      - run: cargo fetch --manifest-path examples/petstore/Cargo.toml
      - run: cargo audit --db target/advisory-dbs/advisory-db-3157b0e258782691 --no-fetch --deny warnings --file examples/petstore/Cargo.lock 2>target/cargo-audit.stderr || { cat target/cargo-audit.stderr >&2; exit 1; }; cat target/cargo-audit.stderr >&2; if grep -qE 'error|warning' target/cargo-audit.stderr; then echo 'cargo audit exited 0 but printed an error or warning above, so it did not check every entry' >&2; exit 1; fi
      - run: cargo fetch --manifest-path examples/petstore-macro/Cargo.toml
      - run: cargo audit --db target/advisory-dbs/advisory-db-3157b0e258782691 --no-fetch --deny warnings --file examples/petstore-macro/Cargo.lock 2>target/cargo-audit.stderr || { cat target/cargo-audit.stderr >&2; exit 1; }; cat target/cargo-audit.stderr >&2; if grep -qE 'error|warning' target/cargo-audit.stderr; then echo 'cargo audit exited 0 but printed an error or warning above, so it did not check every entry' >&2; exit 1; fi
      - run: cargo deny --all-features --locked check
      - run: cargo deny --manifest-path examples/github-api/Cargo.toml --config deny.toml --all-features check
      - run: cargo deny --manifest-path examples/petstore/Cargo.toml --config deny.toml --all-features check
      - run: cargo deny --manifest-path examples/petstore-macro/Cargo.toml --config deny.toml --all-features check

  # `mise run deny-published`'s commands, byte for byte, on scheduled and manual runs only; the
  # comment on `[tasks.deny-published]` in mise.toml says why.
  deny-published:
    name: cargo-deny (published spargen)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - run: |
          rm -rf target/deny-published
          mkdir -p target/deny-published/spargen
          curl -sSf -A 'getkono/spargen deny-published (https://github.com/getkono/spargen)' -o target/deny-published/crate.json https://crates.io/api/v1/crates/spargen
          version=$(jq -er .crate.max_stable_version target/deny-published/crate.json)
          curl -sSfL -o target/deny-published/spargen.crate "https://static.crates.io/crates/spargen/spargen-$version.crate"
          tar -xzf target/deny-published/spargen.crate -C target/deny-published/spargen --strip-components=1
          printf '\n[workspace]\n' >> target/deny-published/spargen/Cargo.toml
          echo "auditing the Cargo.lock published in spargen $version"
      - run: cargo deny fetch db
      - run: git -C target/advisory-dbs/advisory-db-3157b0e258782691 log -1 --format='advisory database revision %H (committed %cI)'
      - run: cargo fetch --locked --manifest-path target/deny-published/spargen/Cargo.toml
      - run: cargo audit --db target/advisory-dbs/advisory-db-3157b0e258782691 --no-fetch --deny warnings --file target/deny-published/spargen/Cargo.lock 2>target/cargo-audit.stderr || { cat target/cargo-audit.stderr >&2; exit 1; }; cat target/cargo-audit.stderr >&2; if grep -qE 'error|warning' target/cargo-audit.stderr; then echo 'cargo audit exited 0 but printed an error or warning above, so it did not check every entry' >&2; exit 1; fi
      - run: cargo deny --manifest-path target/deny-published/spargen/Cargo.toml --config deny.toml --all-features --locked check advisories
