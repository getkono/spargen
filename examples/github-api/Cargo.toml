[package]
name = "spargen-github-api-fixture"
version = "0.0.0"
edition = "2021"
publish = false

[features]
blocking = ["dep:tokio"]

[dependencies]
bytes = { version = "1.12.1", features = ["serde"] }
quick-xml = { version = "0.41.0", features = ["serialize"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "multipart"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Not optional: the generated module names `uuid::Uuid` and the RFC 3339 date newtypes wrap
# `time`, with no `cfg` to hide behind, so a build with either disabled would not compile.
uuid = { version = "1.24.0", features = ["serde"] }
time = { version = "0.3.55", features = ["formatting", "parsing"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.53.1", features = ["rt"], optional = true }

[build-dependencies]
spargen = { path = "../../spargen", default-features = false }

[workspace]
