openapi: 3.1.0
info:
  title: Petstore
  version: 1.0.0
  description: A small OpenAPI 3.1 surface exercising spargen end to end.
# A templated server: spargen generates a typed builder whose variables default to a resolvable
# URL. The example still dials the mock server's ephemeral address, so this exercises the typed
# server surface without pinning a port.
servers:
  - url: http://{host}:{port}
    description: Replaced at runtime by the example's mock server address.
    variables:
      host:
        default: 127.0.0.1
      port:
        default: "0"
security:
  - bearerAuth: []
paths:
  /pets:
    get:
      operationId: listPets
      summary: List pets, optionally filtered.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/Status"
        - name: X-Request-Id
          in: header
          schema:
            type: string
        # `deepObject`: each member becomes its own `filter[member]=value` query pair.
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            $ref: "#/components/schemas/PetFilter"
      responses:
        "200":
          description: The matching pets.
          headers:
            X-Total-Count:
              required: true
              description: Total pets matching the filter, ignoring `limit`.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pets"
    post:
      operationId: createPet
      summary: Register a new pet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPet"
      responses:
        "201":
          description: The stored pet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
  /pets/{petId}:
    get:
      operationId: getPet
      summary: Fetch one pet by id.
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The pet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "404":
          description: No such pet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deletePet
      summary: Remove a pet.
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted.
  /pets/{petId}/photo:
    post:
      operationId: uploadPhoto
      summary: Attach a photo to a pet.
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo, meta]
              properties:
                photo:
                  type: string
                  format: binary
                meta:
                  $ref: "#/components/schemas/PhotoMeta"
            # Without this the object part would default to `application/json` anyway; declaring it
            # pins the part's Content-Type explicitly, which is what a server validating parts sees.
            encoding:
              photo:
                contentType: image/png
              meta:
                contentType: application/json
      responses:
        "204":
          description: Stored.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Status:
      type: string
      description: Sale status of a pet.
      enum: [available, sold]
    Pet:
      type: object
      description: A pet in the store.
      required: [id, name, status]
      properties:
        id:
          type: string
        name:
          type: string
        status:
          $ref: "#/components/schemas/Status"
        tag:
          type: string
    NewPet:
      type: object
      required: [name]
      properties:
        name:
          type: string
        tag:
          type: string
    Pets:
      type: array
      items:
        $ref: "#/components/schemas/Pet"
    PetFilter:
      type: object
      description: A flat filter object; `deepObject` is only defined for flat objects.
      properties:
        name:
          type: string
        tag:
          type: string
    PhotoMeta:
      type: object
      required: [caption]
      properties:
        caption:
          type: string
        width:
          type: integer
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
