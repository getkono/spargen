# AGENTS.md's Workspace section describes each member.
[workspace]
resolver = "2"
members = ["spargen", "spargen-macro", "support-runtime"]
# `fuzz/` is an excluded crate, built only by hand under `cargo +nightly fuzz`; `fuzz/README.md`
# says why.
exclude = ["fuzz"]

[workspace.package]
version = "0.6.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Justin Chung"]
repository = "https://github.com/getkono/spargen"
description = "A compile-time-correct Rust client generator for OpenAPI 3.1.x and 3.2.x."
keywords = ["openapi", "codegen", "client"]
categories = ["development-tools", "api-bindings"]

# Shared dependency versions. Each subsystem opts in from its own crate manifest; an entry lands
# here when the first member needs it, and leaves when the last member stops.
[workspace.dependencies]
bytes = "1.12.1"
futures-core = "0.3.32"
http = "1.4.2"
http-body = "1.0.1"
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", default-features = false }
secrecy = "0.10.3"
serde = "1.0.229"
serde_json = "1.0.151"
time = "0.3.55"
tokio = "1.53.3"
semver = "1.0"
camino = "1.1"
indexmap = "2.2"
yaml-rust2 = "0.11"
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
prettyplease = "0.2"
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
# Evaluates the consumer's `[target.'cfg(…)'.dependencies]` keys the way Cargo does, so the `E023`
# audit finds the blocking client's `tokio` by what its cfg means for the build rather than by how
# it is spelled. Default features stay off: the builtin target database needs no `target-lexicon`.
cfg-expr = { version = "0.20.9", default-features = false }
proptest = "1.11"
tempfile = "3.10"
insta = "1.43"
sha2 = "0.10"
# Default features off to skip the `plotters`/`rayon` report stack.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

# Full debug info is what makes `target/` grow during fast iteration, so dev (and `test`, which
# inherits both tables below) keeps only what a backtrace reads: workspace libraries, binaries and
# tests keep line tables, so their backtrace frames still name file:line; dependencies keep no
# debug info, so their frames still name the function where it was not inlined (from the symbol
# table) but generally lose file:line. Build scripts and `spargen-macro` follow Cargo's
# `build-override` default, as before. Release is untouched. For full debug info, override one
# build rather than editing this: `CARGO_PROFILE_DEV_DEBUG=2` covers the workspace crates, and
# `cargo --config 'profile.dev.package."*".debug=2' …` the dependencies; pass both for everything.
[profile.dev]
debug = "line-tables-only"

# The test suites run the generator in-process thousands of times, mostly inside dependency code
# (jsonschema, syn/prettyplease, serde_json); at opt-level 0 that made them ~2.5x slower. `"*"`
# matches only non-workspace packages, so spargen itself keeps fast rebuilds and debug assertions.
[profile.dev.package."*"]
opt-level = 3
debug = false

# `cargo bench` builds under the `bench` profile, which inherits this table, so `mise run bench`
# and the record `benchmarks.yml` keeps for each `spargen` release measure thin-LTO code; keeping
# the table unchanged keeps that series comparable from one release to the next. It also governs a
# `cargo build --release` or `cargo install --path spargen` run from this checkout, where `strip`
# removes symbols and debug info from the binary. Cargo reads profiles only from the root manifest
# of the workspace it builds, and `cargo package` writes each published crate's manifest without
# this table, so `cargo install spargen` and every consumer build `spargen` and `spargen-macro`
# under their own profiles (Cargo's default release profile, `lto = false`, does thin-local LTO
# within each crate but no cross-crate LTO): the bench numbers describe this workspace's build, not
# theirs. To measure that default, override one run rather than editing this:
# `CARGO_PROFILE_BENCH_LTO=false cargo bench --bench generate`.
[profile.release]
strip = true
lto = "thin"
