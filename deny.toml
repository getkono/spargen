# cargo-deny policy for every committed lockfile, the examples' included; AGENTS.md's "Lockfiles
# and advisories" says how `mise run deny` applies it.

[advisories]
version = 2
yanked = "deny"
# Inside the gitignored `target/`; cargo-deny clones into `advisory-db-<hash of the URL>` below it.
db-path = "target/advisory-dbs"

[licenses]
version = 2
# Spargen and its dependency surface are permissive-only.
allow = [
    "MIT",
    # `borrow-or-share`, reached only through the generator-side official-schema validator's URI
    # resolver, uses MIT No Attribution. It is OSI-approved and does not enter generated output.
    "MIT-0",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # Mozilla's bundled CA roots (`webpki-roots`), reached through the reqwest rustls-tls stack
    # used by `spargen lock`. A permissive data license; the generated-output runtime graph is
    # unaffected (it carries its own default-features-off reqwest).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Every example reaches `spargen` through a version-less path dependency on purpose; this exempts
# path dependencies of `publish = false` crates only.
allow-wildcard-paths = true
# Advisory floors, each paired with a requirement in `spargen/Cargo.toml` (AGENTS.md, "Lockfiles
# and advisories"). Keep the `name` + `version` form: cargo-deny reads `crate = "name@<X"` as the
# exact release `X`.
deny = [
    { name = "rustls", version = "<0.23.46", reason = "RUSTSEC-2026-0285, RUSTSEC-2026-0346, RUSTSEC-2026-0347, RUSTSEC-2026-0348, RUSTSEC-2026-0349" },
    { name = "rustls-webpki", version = "<0.103.16", reason = "RUSTSEC-2026-0382" },
    { name = "webpki-roots", version = "<1.0.10", reason = "RUSTSEC-2026-0381" },
    { name = "tokio", version = "<1.53.3", reason = "RUSTSEC-2026-0386" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
