# cargo-deny configuration — supply-chain gate run on every PR.
# Licenses, security advisories, and duplicate/banned dependencies.
#
# One policy for every committed lockfile: `mise run deny` audits the root workspace and, with
# `--config deny.toml`, each example workspace under `examples/` (#184). The examples are
# compiled by gating jobs (for `wasm32-unknown-unknown` too), and their resolves carry crates the
# root one never reaches, so a sibling policy per example would be a second copy that can drift.

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Spargen and its dependency surface are permissive-only.
allow = [
    "MIT",
    # `borrow-or-share`, reached only through the generator-side official-schema validator's URI
    # resolver, uses MIT No Attribution. It is OSI-approved and does not enter generated output.
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # Mozilla's bundled CA roots (`webpki-roots`), reached through the reqwest rustls-tls stack
    # used by `spargen lock`. A permissive data license; the generated-output runtime graph is
    # unaffected (it carries its own default-features-off reqwest).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A path dependency without a `version` is a wildcard, and every example reaches `spargen` (or
# `spargen-macro`) that way on purpose: it builds against this checkout's generator. This exempts
# path dependencies of `publish = false` crates only; a published crate's still fails, as `cargo
# publish` would.
allow-wildcard-paths = true
# Advisory floors. Each mirrors a direct requirement at the same release in `spargen/Cargo.toml`,
# which is what the resolver enforces here and in every consumer's resolve; this entry names the
# advisory and still fails once the database stops carrying it. Use the `name` + `version` form:
# cargo-deny reads `crate = "name@<X"` as the exact release `X`. `advisory_floors_are_manifest_requirements`
# in `spargen/tests/corpus_manifest.rs` holds both.
deny = [
    { name = "rustls", version = "<0.23.45", reason = "RUSTSEC-2026-0285" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
