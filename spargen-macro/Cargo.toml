# The proc-macro front-end for spargen, a crate of its own as every proc-macro is; `spargen` must
# never depend back on it (AGENTS.md, Workspace).
[package]
name = "spargen-macro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Proc-macro front-end for spargen: generate a typed OpenAPI 3.1/3.2 client inline with generate_api!."
keywords = ["openapi", "codegen", "client", "macro"]
categories = ["development-tools", "api-bindings"]
readme = "README.md"

[lib]
proc-macro = true

[dependencies]
# The generator, with no spargen feature requested: the generation pipeline needs none, and
# `default-features = false` keeps it that way should spargen's default set ever grow.
# The `uuid` and date-time output mappings are controlled at call time through
# `Spec::uuid`/`Spec::datetime` (or the macro's `no_uuid`/`datetime = "…"`), not by Cargo features.
# The version is an exact `=` requirement: the macro calls spargen's `#[doc(hidden)]` `__private`
# bridge, which carries no semver promise, so a macro release is only ever paired with the spargen
# release it was built against. release-plz keeps the `=` operator when it bumps the version.
spargen = { path = "../spargen", version = "=0.8.0", default-features = false }
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }
