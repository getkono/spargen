openapi: 3.1.0
info:
  title: "Moderation, by [`crate::App`]"
  version: 1.0.0
  description: |
    The moderation API, served by [`crate::serve`]. See https://example.com/docs.
servers:
  - url: https://{region}.example.com
    description: "The regional host, routed by [Router].\rIts \u202Ename\u202C is regional."
    variables:
      region:
        default: eu
        description: "A region code, as [`Region`] lists them.\rOne of \u2067eu\u2069."
components:
  securitySchemes:
    token:
      type: http
      scheme: bearer
      description: "A token [`crate::auth::mint`] issues; see https://example.com/auth.\rIt expires\
        \ hourly."
  schemas:
    Report:
      description: |
        A report the [ModerationStore] holds, as a Vec<Entry>, shaped as [Vec<Note>] and
        [Page<Report>](https://example.com/page).

        ```text
        [kept] Vec<kept>
        ```

        [ModerationStore]: crate::store::ModerationStore
        [vec<note>]: https://example.com/note
      type: object
      required: [id]
      properties:
        id: { type: string }
        summary:
          type: string
          description: "First line.\rSecond line, after a lone CR.\nThird line."
        author:
          type: string
          description: "The author's name, as written: \u202Ereversed\u202C and \u2066isolated\u2069."
        steps:
          type: string
          description: "- a step\n        over indented\n        - not a nested item\n        > not a quote\n        1. not an ordered item"
        layout:
          type: string
          description: "- ```yaml\n  a:\n      b: 1\n      # c\n  ```"
paths:
  /reports/export:
    post:
      operationId: exportReports
      summary: Export reports.
      description: |
        A payload:

        ```
        {"id":1}
        ```

        A program:

        ```
        fn main() {}
        ```

        A command:

            curl https://example.com/b

        - A step, then its command:

              curl https://example.com/c

        ````
        ```
        Vec<T>
        ```
        ````

        ```
        an unclosed block
      responses:
        "204":
          description: exported
  /reports:
    get:
      operationId: listReports
      summary: List reports, as [`ModerationStore::list`] does.
      description: |
        Reads the [store][ModerationStore] and returns <b>every</b> report, up to the
        limit </b> set in [the config](crate::config::Limits). Details at
        https://example.com/reports. Each is a <T/> page, beside a void <br/>.
      responses:
        "200":
          description: ok
          headers:
            X-Rate-Limit:
              description: The limit [`crate::limits::Rate`] applies.
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Report" }
