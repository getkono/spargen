[package]
name = "spargen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../README.md"

[features]
default = []
# Gates the optional analysis/vendor binary and its dependencies. Install with
# `cargo install spargen --features cli`; library/build-script users get no CLI stack by default.
cli = ["dep:clap", "remote-fetch"]
# Enables the reqwest-backed remote fetcher behind `spargen lock`. This is the ONLY place the
# generator touches the network; `generate`/`check` never do. It is pulled in by `cli` so the
# installed binary can vendor remote `$ref`s, and kept as a separate feature so a library-only
# build (e.g. from `build.rs`) can opt in without the whole CLI.
remote-fetch = [
    "dep:reqwest",
    "dep:rustls",
    "dep:rustls-webpki",
    "dep:tokio",
    "dep:webpki-roots",
]

[dependencies]
# diag
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
semver = { workspace = true }
toml = { workspace = true }
camino = { workspace = true }
# runtime_contract — cfg evaluation for target-scoped dependency tables (host-only for consumers)
cfg-expr = { workspace = true }
# source
indexmap = { workspace = true }
yaml-rust2 = { workspace = true }
# oas31 — generator-side validation only. Default features stay off so validation is fully
# hermetic: the official OpenAPI schemas are embedded below and no HTTP/file retriever is linked.
jsonschema = { version = "0.49.3", default-features = false }
# name
proc-macro2 = { workspace = true }
quote = { workspace = true }
# codegen
syn = { workspace = true }
prettyplease = { workspace = true }
# cli (feature-gated)
clap = { workspace = true, optional = true }
# Remote-fetch (feature-gated): the ONLY networked path, used by `spargen lock` to vendor
# remote `$ref`s. Not in the runtime graph of generated output — this is the generator only.
# Its own requirement rather than the workspace's: generated clients move with the workspace
# entry, while this fetcher stays on the 0.12 line, whose `rustls-tls` selects ring and the
# bundled `webpki-roots` the floors below and `tests/tls_strictness.rs` pin (0.13's `rustls`
# selects aws-lc-rs and the platform verifier instead).
reqwest = { version = "0.12.28", default-features = false, features = [
    "blocking",
    "rustls-tls",
], optional = true }
# Advisory floors, never named in code, with default features off so none adds a feature to what
# reqwest selects; each is mirrored by a `[bans] deny` entry in `deny.toml`
# (.claude/rules/dependencies.md). The TLS handshake test in `src/source/vendor/tests.rs` serves TLS through the
# rustls entry rather than through a dev-dependency, which would put a TLS crate in the
# default-features graph `the_all_features_workspace_graph_carries_a_tls_stack` holds free of one:
# removing that floor means giving the test another way to name rustls.
rustls = { version = "0.23.46", default-features = false, optional = true }
rustls-webpki = { version = "0.103.16", default-features = false, optional = true }
webpki-roots = { version = "1.0.10", default-features = false, optional = true }
tokio = { version = "1.53.3", default-features = false, optional = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
# `tests/snapshot.rs`
insta = { workspace = true }
# `benches/generate.rs`
criterion = { workspace = true }
# The corpus integrity gate (`tests/corpus_manifest.rs`)
sha2 = { workspace = true }

[[bin]]
name = "spargen"
required-features = ["cli"]

# Every case in `tests/cli.rs` spawns `CARGO_BIN_EXE_spargen`, which `env!` expands to a path
# even when the `cli` feature is off and the binary is not built; gating the target on the same
# feature skips the suite then, instead of running it against whatever file occupies that path.
[[test]]
name = "cli"
required-features = ["cli"]

# `harness = false` hands argument parsing and statistics to criterion instead of libtest;
# `mise run bench-build` runs each benchmark once in test mode.
[[bench]]
name = "generate"
harness = false
