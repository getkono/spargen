[package]
name = "spargen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../README.md"

[features]
default = []
# Gates the optional analysis/vendor binary and its dependencies. Install with
# `cargo install spargen --features cli`; library/build-script users get no CLI stack by default.
cli = ["dep:clap", "remote-fetch"]
# Enables the reqwest-backed remote fetcher behind `spargen lock`. This is the ONLY place the
# generator touches the network; `generate`/`check` never do. It is pulled in by `cli` so the
# installed binary can vendor remote `$ref`s, and kept as a separate feature so a library-only
# build (e.g. from `build.rs`) can opt in without the whole CLI.
remote-fetch = ["dep:reqwest"]

[dependencies]
# diag
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
semver = { workspace = true }
toml = { workspace = true }
camino = { workspace = true }
# source
indexmap = { workspace = true }
yaml-rust2 = { workspace = true }
# oas31 — generator-side validation only. Default features stay off so validation is fully
# hermetic: the official OpenAPI schemas are embedded below and no HTTP/file retriever is linked.
jsonschema = { version = "0.49.3", default-features = false }
# name
proc-macro2 = { workspace = true }
quote = { workspace = true }
# codegen
syn = { workspace = true }
prettyplease = { workspace = true }
# cli (feature-gated)
clap = { workspace = true, optional = true }
# Remote-fetch (feature-gated): the ONLY networked path, used by `spargen lock` to vendor
# remote `$ref`s. Not in the runtime graph of generated output — this is the generator only.
reqwest = { workspace = true, features = [
    "blocking",
    "rustls-tls",
], optional = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
# Snapshot testing for the corpus content-regression guard (`tests/snapshot.rs`). Dev-only: it
# never enters a library/build.rs graph nor the generated-output runtime.
insta = { workspace = true }
# Benchmark harness (`benches/generate.rs`, run via `cargo bench`). Dev-only.
criterion = { workspace = true }

[[bin]]
name = "spargen"
required-features = ["cli"]

# End-to-end generation-pipeline benchmarks. `harness = false` hands argument parsing and
# statistics to criterion instead of libtest. Not part of the normal `cargo test` gate.
[[bench]]
name = "generate"
harness = false
